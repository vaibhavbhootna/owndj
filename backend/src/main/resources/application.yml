server:
  port: ${PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: virtual-dj-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:owndj}}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true

youtube:
  api-key: ${YOUTUBE_API_KEY:}
  max-search-results: 15

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  session:
    code-length: 6
    token-secret: ${APP_TOKEN_SECRET:virtual-dj-super-secret-salt-2026}
  rate-limit:
    search-per-minute: 30
    request-per-minute: 10

logging:
  level:
    root: INFO
    com.owndj: DEBUG
    org.springframework.web.socket: INFO
