services:
  postgres:
    image: postgres:16-alpine
    container_name: owndj-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-owndj}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: owndj-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-owndj}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      APP_TOKEN_SECRET: ${APP_TOKEN_SECRET:-virtual-dj-super-secret-salt-2026}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: owndj-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

  audio-analysis:
    build:
      context: ./audio-analysis
      dockerfile: Dockerfile
    container_name: owndj-audio-analysis
    restart: unless-stopped
    ports:
      - "5000:5000"

volumes:
  pgdata:
    name: owndj_pgdata
  uploads_data:
    name: owndj_uploads_data
